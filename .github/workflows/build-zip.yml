name: Build zip

# Builds the app on Ubuntu 26.04, the same image upstream uses for its .deb, and packs the
# install tree with packaging/zip/install.sh into one zip. Run it from the Actions tab, or
# push a tag such as v0.1.0 to also attach the zip to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          bash packaging/linux/install-build-deps.sh
          apt-get install -y --no-install-recommends zip
      - name: Create unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build release and stage the install tree
        run: |
          runuser -u builder -- env HOME=/home/builder bash <<'BUILD'
            set -eu
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup show active-toolchain
            cargo xtask package --format dir
          BUILD
      - name: Assemble zip
        run: |
          name="marshmellow-linux-$(uname -m)"
          mkdir -p "stage/$name"
          cp -a dist/linux-root/usr "stage/$name/usr"
          cp packaging/zip/install.sh "stage/$name/install.sh"
          chmod 755 "stage/$name/install.sh"
          (cd stage && zip -r -X "../$name.zip" "$name")
          unzip -l "$name.zip" | tail -n 25
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: marshmellow-linux-zip
          path: marshmellow-linux-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: marshmellow-linux-zip
          path: .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./marshmellow-linux-*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
